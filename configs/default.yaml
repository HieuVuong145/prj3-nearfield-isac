array: {N: 129, fc: 28.0e9, d_over_lambda: 0.5}
signal: {T: 256, P: 1.0, waveform: iso, snr_db: 10}
targets_region: {r_min: 3.0, r_max: 60.0, theta_deg: [30, 150]}
grid:
  music_mu: 0.95          # legacy (not used by B1 any more, see DECISIONS #4)
  coarse_mu: 0.7          # coarse grid (hierarchical / B3 stage)
  cs_mu: 0.5              # CS dictionary
  u_oversample: 2         # coarse u step = 2/(N*u_oversample)
  ov_u: 8                 # B1 fine grid: points per angle cell (2/N)
  ov_w: 8                 # B1 fine grid: points per range cell cell_w(90deg)
  mu_cell: 0.5            # coherence level defining a range cell
mc: {n_trials: 200, seed: 0, n_jobs: -1}
